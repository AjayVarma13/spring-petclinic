<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Developer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        label {
            display: inline-block;
            width: 80px;
            margin-bottom: 10px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Add Developer</h1>

    <form th:action="@{/developers}" th:object="${developer}" method="post">
        <div>
       <label>Name</label>
       <input type="text" th:field="*{name}">

      <p class="error"
       th:if="${#fields.hasErrors('name')}"
       th:errors="*{name}">
      </p>
</div>

    <div>
     <label>Skill</label>
     <input type="text" th:field="*{skill}">

        <p class="error"
       th:if="${#fields.hasErrors('skill')}"
       th:errors="*{skill}">
       </p>
    </div>

        <button type="submit">Save</button>

    </form>

    <a th:href="@{/developers}">Back to Developers</a>

</body>

</html>
