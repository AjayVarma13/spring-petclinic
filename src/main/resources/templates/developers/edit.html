<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Developer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        label {
            display: inline-block;
            width: 80px;
            margin-bottom: 10px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
        .error {
           color: #dc3545;
           font-size: 12px;
           font-weight: bold;
           margin-top: 4px;
         }
       .required {
         color: red;
       }
    </style>
</head>

<body>

    <h1>Edit Developer</h1>

    <form th:action="@{/developers/update/{id}(id=${developer.id})}" th:object="${developer}" method="post">

        <input type="hidden" th:field="*{id}">

        <div>
            <label>Name <span class="required">*</span></label>
            <input type="text" th:field="*{name}">
            <p class="error"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}">
            </p>
        </div>

        <div>
            <label>Skill <span class="required">*</span></label>
            <input type="text" th:field="*{skill}">
            <p class="error"
               th:if="${#fields.hasErrors('skill')}"
               th:errors="*{skill}">
            </p>
        </div>

        <button type="submit">Update</button>

    </form>

    <a th:href="@{/developers}">Back to Developers</a>

</body>

</html>
