<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <title>Developers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .add-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 12px;
            background-color: green;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<h1>Developers</h1>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Skill</th>
        <th>Actions</th>
    </tr>

    <tr th:each="developer : ${developers}">
        <td th:text="${developer.id}"></td>
        <td th:text="${developer.name}"></td>
        <td th:text="${developer.skill}"></td>

        <td>
            @{/developers/edit/{id}(id=${developer.id})}
                Edit
            </a>
        </td>
    </tr>

</table>

</body>
</html>
