<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Developers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 80%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin-bottom: 15px;
            color: white;
            text-decoration: none;
            background-color: green;
            border-radius: 4px;
        }
        .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
}

.modal-box {
    background: white;
    padding: 20px;
    border-radius: 8px;
    width: 350px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.modal-actions {
    margin-top: 20px;
    text-align: right;
}

.modal-actions button {
    margin-left: 10px;
}

    </style>
</head>

<body>

    <h1>Developers</h1>

    <a class="btn" th:href="@{/developers/new}">
        Add Developer
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Skill</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="developer : ${developers}">
                <td th:text="${developer.id}"></td>
                <td th:text="${developer.name}"></td>
                <td th:text="${developer.skill}"></td>
                <td>
                    <a th:href="@{/developers/edit/{id}(id=${developer.id})}">
                        Edit
                    </a>
                <a th:href="@{/developers/delete/{id}(id=${developer.id})}"
                   th:data-name="${developer.name}"
                   onclick="openDeleteModal(event, this.href, this.dataset.name)">
                   Delete
                 </a>

 
                </td>
            </tr>
        </tbody>
    </table>
 <script>   
  function openDeleteModal(event, deleteUrl, developerName) {


    event.preventDefault();

    const developerId =
        deleteUrl.substring(deleteUrl.lastIndexOf('/') + 1);

    const apiDeleteUrl =
        '/api/v1/developers/' + developerId;

    document.getElementById('deleteUrl').value =
        apiDeleteUrl;

    document.getElementById('deleteModal').style.display =
        'flex';
}

function closeDeleteModal() {
    document.getElementById('deleteModal').style.display = 'none';
}

async function confirmDelete() {

    const deleteUrl =
        document.getElementById('deleteUrl').value;

    const response = await fetch(deleteUrl, {
        method: 'DELETE'
    });

    if (response.ok) {

        closeDeleteModal();

        alert('Developer deleted successfully');
    }

}

</script>
<div id="deleteModal" class="modal-overlay">

    <div class="modal-box">

        <h3>Delete Developer</h3>

        <p>Are you sure you want to delete this developer?</p>

        <input type="hidden" id="deleteUrl">

        <div class="modal-actions">
            <button type="button" onclick="closeDeleteModal()">
                Cancel
            </button>

            <button type="button" onclick="confirmDelete()">
                Delete
            </button>
        </div>

    </div>

</div>


</body>

</html>
