<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Developers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 80%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin-bottom: 15px;
            color: white;
            text-decoration: none;
            background-color: green;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1>Developers</h1>

    <a class="btn" th:href="@{/developers/new}">
        Add Developer
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Skill</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="developer : ${developers}">
                <td th:text="${developer.id}"></td>
                <td th:text="${developer.name}"></td>
                <td th:text="${developer.skill}"></td>
                <td>
                    <a th:href="@{/developers/edit/{id}(id=${developer.id})}">
                        Edit
                    </a>
                    <a th:href="@{/developers/delete/{id}(id=${developer.id})}"
                        onclick="openDeleteModal(event, this.href)">
                        Delete
                    </a>
 
                </td>
            </tr>
        </tbody>
    </table>
 <script>   
  function openDeleteModal(event, deleteUrl) {
    event.preventDefault();
    alert("Custom delete modal will come next. Delete URL: " + deleteUrl);
}
</script>

</body>

</html>
