<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"></html>
<head>
    <title>Developers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
        }
    </style>
</head>

<body>

<h1>Developers</h1>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Skill</th>
    </tr>

    <tr th:each="developer : ${developers}">
        <td th:text="${developer.id}"></td>
        <td th:text="${developer.name}"></td>
        <td th:text="${developer.skill}"></td>
    </tr>

</table>

</body>
</html>
